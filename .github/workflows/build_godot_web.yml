name: Build Godot Web Editor

on:
  workflow_dispatch:
    inputs:
      godot_version:
        description: 'Godot Git Tag / Branch'
        required: true
        default: '4.7-stable'
      emsdk_version:
        description: 'Emscripten SDK Version'
        required: true
        default: '3.1.64'

jobs:
  build-web-editor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Godot Repository
        uses: actions/checkout@v4
        with:
          repository: 'godotengine/godot'
          ref: ${{ github.event.inputs.godot_version }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        run: python -m pip install scons

      - name: Set up Emscripten SDK
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ github.event.inputs.emsdk_version }}
          actions-cache-folder: 'emsdk-cache'

      - name: Verify Emscripten Environment
        run: emcc -v

      - name: Compile Godot Web Editor
        run: |
          scons platform=web target=editor -j$(nproc)

      - name: Upload Web Editor ZIP
        uses: actions/upload-artifact@v4
        with:
          name: godot-web-editor-${{ github.event.inputs.godot_version }}
          path: bin/godot.web.editor.wasm32.zip
          retention-days: 7
